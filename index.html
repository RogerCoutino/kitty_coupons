<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#fff4f7">

  <title>Kitty Coupons 🐾</title>

  <style>
    :root {
      --text: #44373d;
      --background: #fff6f8;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--background);
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Rounded",
        "Segoe UI",
        sans-serif;

      color: var(--text);

      min-height: 100dvh;

      background:
        radial-gradient(circle at 10% 8%, #ffdce8 0 7%, transparent 8%),
        radial-gradient(circle at 90% 16%, #e4dcff 0 8%, transparent 9%),
        radial-gradient(circle at 15% 70%, #fff0ba 0 5%, transparent 6%),
        linear-gradient(180deg, #fff4f8, #fffaf3);

      padding:
        calc(18px + env(safe-area-inset-top))
        18px
        calc(35px + env(safe-area-inset-bottom));

      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 430px;
      margin: auto;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      text-align: center;
      padding: 12px 10px 25px;
    }

    .hero-kitty {
      width: 115px;
      height: 115px;
      margin: auto;
    }

    h1 {
      margin: 5px 0 0;

      font-size: clamp(34px, 10vw, 45px);
      line-height: 1;

      letter-spacing: -2px;
    }

    .subtitle {
      max-width: 320px;
      margin: 13px auto 0;

      font-size: 15px;
      line-height: 1.45;

      opacity: .68;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 15px 18px;

      border-radius: 23px;

      background: rgba(255,255,255,.75);

      border: 1.5px solid rgba(255,255,255,.9);

      box-shadow:
        0 10px 30px
        rgba(108,71,86,.08);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      margin-bottom: 19px;
    }

    .status-label {
      font-size: 14px;
      opacity: .66;
    }

    .infinity {
      font-size: 25px;
      font-weight: 900;
    }

    /* =========================
       COUPONS
    ========================= */

    .coupons {
      display: grid;
      gap: 20px;
    }

    .coupon {
      position: relative;

      min-height: 290px;

      padding: 24px;

      border-radius: 31px;

      overflow: hidden;

      background: var(--coupon-color);

      border: 2px solid rgba(255,255,255,.8);

      box-shadow:
        0 16px 36px rgba(105,75,87,.12),
        inset 0 1px rgba(255,255,255,.8);

      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }

    .coupon:active {
      transform: scale(.99);
    }

    .coupon::before {
      content: "";

      position: absolute;

      width: 160px;
      height: 160px;

      border-radius: 50%;

      right: -70px;
      top: -65px;

      background: rgba(255,255,255,.22);
    }

    .coupon::after {
      content: "";

      position: absolute;

      width: 110px;
      height: 110px;

      border-radius: 50%;

      left: -45px;
      bottom: -50px;

      background: rgba(255,255,255,.2);
    }

    .coupon-header {
      position: relative;
      z-index: 5;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      height: 90px;
    }

    .coupon-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      padding: 7px 12px;

      border-radius: 999px;

      background: rgba(255,255,255,.63);

      font-size: 11px;
      font-weight: 850;

      text-transform: uppercase;
      letter-spacing: .7px;

      max-width: 170px;
    }

    .coupon h2 {
      position: relative;
      z-index: 4;

      margin: 13px 0 8px;

      font-size: 27px;
      line-height: 1.05;

      letter-spacing: -.9px;
    }

    .coupon p {
      position: relative;
      z-index: 4;

      max-width: 290px;

      margin: 0 0 22px;

      font-size: 15px;
      line-height: 1.45;

      opacity: .76;
    }

    /* =========================
       BUTTON
    ========================= */

    .redeem-button {
      position: relative;
      z-index: 10;

      width: 100%;

      border: none;
      border-radius: 18px;

      padding: 16px;

      font-size: 16px;
      font-weight: 850;

      color: white;
      background: #44373d;

      cursor: pointer;

      box-shadow:
        0 7px 0
        rgba(0,0,0,.12);

      transition:
        transform .12s ease,
        box-shadow .12s ease,
        background .2s ease;
    }

    .redeem-button:active {
      transform: translateY(5px);

      box-shadow:
        0 2px 0
        rgba(0,0,0,.12);
    }

    .redeem-button.success {
      background: #738e7c;
    }

    /* =========================
       CSS KITTY
    ========================= */

    .kitty {
      --fur: #ef9b4d;
      --fur-dark: #c87332;
      --belly: #ffd6a7;
      --paw: var(--fur);

      position: relative;

      width: 100px;
      height: 105px;

      flex-shrink: 0;

      animation:
        kittyFloat
        3.2s ease-in-out infinite;

      transform-origin: bottom center;
    }

    .kitty-black {
      --fur: #36323b;
      --fur-dark: #211f25;
      --belly: #46404c;
      --paw: #36323b;
    }

    .kitty-orange {
      --fur: #f4a04f;
      --fur-dark: #cf7031;
      --belly: #ffd3a1;
      --paw: #f4a04f;
    }

    .kitty-tuxedo {
      --fur: #38343d;
      --fur-dark: #232127;
      --belly: #fff8f2;
      --paw: #fff8f2;
    }

    .kitty-cream {
      --fur: #f1cba1;
      --fur-dark: #b98a67;
      --belly: #fff0dc;
      --paw: #f1cba1;
    }

    @keyframes kittyFloat {
      0%, 100% {
        transform:
          translateY(0)
          rotate(-2deg);
      }

      50% {
        transform:
          translateY(-6px)
          rotate(2deg);
      }
    }

    /* BODY */

    .kitty-body {
      position: absolute;

      width: 61px;
      height: 62px;

      bottom: 0;
      left: 20px;

      border-radius:
        45% 45% 35% 35%;

      background: var(--fur);

      z-index: 2;
    }

    .kitty-belly {
      position: absolute;

      width: 29px;
      height: 39px;

      left: 16px;
      bottom: 2px;

      border-radius: 50%;

      background: var(--belly);

      opacity: .95;
    }

    /* HEAD */

    .kitty-head {
      position: absolute;

      width: 72px;
      height: 62px;

      left: 14px;
      top: 4px;

      border-radius:
        45% 45% 48% 48%;

      background: var(--fur);

      z-index: 5;
    }

    /* EARS */

    .ear {
      position: absolute;

      width: 27px;
      height: 31px;

      top: -11px;

      background: var(--fur);

      z-index: -1;
    }

    .ear::after {
      content: "";

      position: absolute;

      width: 13px;
      height: 17px;

      background: #eba6ac;

      opacity: .65;

      top: 7px;
      left: 7px;
    }

    .ear-left {
      left: 3px;

      transform:
        rotate(-17deg);

      clip-path:
        polygon(
          50% 0,
          100% 100%,
          0 100%
        );

      animation:
        earLeftTwitch
        5s ease-in-out infinite;
    }

    .ear-right {
      right: 3px;

      transform:
        rotate(17deg);

      clip-path:
        polygon(
          50% 0,
          100% 100%,
          0 100%
        );

      animation:
        earRightTwitch
        5s ease-in-out infinite;
    }

    @keyframes earLeftTwitch {
      0%, 80%, 100% {
        transform: rotate(-17deg);
      }

      84% {
        transform: rotate(-26deg);
      }

      88% {
        transform: rotate(-17deg);
      }
    }

    @keyframes earRightTwitch {
      0%, 86%, 100% {
        transform: rotate(17deg);
      }

      90% {
        transform: rotate(27deg);
      }

      94% {
        transform: rotate(17deg);
      }
    }

    /* EYES */

    .eye {
      position: absolute;

      width: 8px;
      height: 10px;

      top: 28px;

      border-radius: 50%;

      background: #33282c;

      animation:
        blink
        4.2s infinite;
    }

    .eye-left {
      left: 20px;
    }

    .eye-right {
      right: 20px;
    }

    @keyframes blink {
      0%, 43%, 47%, 100% {
        transform:
          scaleY(1);
      }

      45% {
        transform:
          scaleY(.08);
      }
    }

    /* MUZZLE */

    .muzzle {
      position: absolute;

      width: 24px;
      height: 16px;

      top: 37px;
      left: 24px;

      border-radius: 50%;

      background:
        rgba(255,246,239,.65);
    }

    .kitty-tuxedo .muzzle {
      width: 38px;
      height: 25px;

      left: 17px;
      top: 34px;

      background: #fff8f2;
    }

    .nose {
      position: absolute;

      width: 7px;
      height: 5px;

      top: 39px;
      left: 33px;

      border-radius:
        50% 50% 65% 65%;

      background: #e58491;

      z-index: 3;
    }

    .mouth {
      position: absolute;

      width: 12px;
      height: 8px;

      top: 44px;
      left: 30px;

      border-bottom:
        2px solid
        #6c4c55;

      border-radius: 50%;
    }

    /* ORANGE STRIPES */

    .kitty-marking {
      display: none;
    }

    .kitty-orange .kitty-marking {
      display: block;

      position: absolute;

      width: 6px;
      height: 15px;

      left: 33px;
      top: 2px;

      border-radius: 5px;

      background: var(--fur-dark);

      box-shadow:
        -10px 3px 0 -1px var(--fur-dark),
        10px 3px 0 -1px var(--fur-dark);
    }

    /* TUXEDO FOREHEAD */

    .kitty-tuxedo .kitty-marking {
      display: block;

      position: absolute;

      width: 27px;
      height: 30px;

      top: -1px;
      left: 23px;

      background: #fff8f2;

      clip-path:
        polygon(
          15% 0,
          85% 0,
          65% 100%,
          50% 80%,
          35% 100%
        );
    }

    /* PAWS */

    .kitty-paw {
      position: absolute;

      width: 19px;
      height: 15px;

      bottom: -2px;

      border-radius:
        60% 60% 50% 50%;

      background: var(--paw);

      z-index: 5;
    }

    .paw-left {
      left: 7px;
    }

    .paw-right {
      right: 7px;
    }

    /* TAIL */

    .kitty-tail {
      position: absolute;

      width: 51px;
      height: 16px;

      right: -11px;
      bottom: 20px;

      border-radius: 15px;

      background: var(--fur);

      transform-origin:
        left center;

      animation:
        tailWag
        2.8s ease-in-out infinite;

      z-index: 1;
    }

    .kitty-tail::after {
      content: "";

      position: absolute;

      width: 20px;
      height: 16px;

      right: -5px;

      border-radius: 50%;

      background: var(--fur-dark);
    }

    @keyframes tailWag {
      0%, 100% {
        transform:
          rotate(16deg);
      }

      50% {
        transform:
          rotate(-14deg);
      }
    }

    /* WHISKERS */

    .whiskers {
      position: absolute;

      top: 43px;

      width: 20px;
      height: 1px;

      background:
        rgba(80,65,70,.65);
    }

    .whiskers::before,
    .whiskers::after {
      content: "";

      position: absolute;

      width: 19px;
      height: 1px;

      background:
        rgba(80,65,70,.65);

      left: 0;
    }

    .whiskers::before {
      top: -5px;
      transform: rotate(8deg);
    }

    .whiskers::after {
      top: 5px;
      transform: rotate(-8deg);
    }

    .whiskers-left {
      left: -8px;
    }

    .whiskers-right {
      right: -8px;
    }

    /* =========================
       CELEBRATION
    ========================= */

    .coupon.celebrate .kitty {
      animation:
        kittyCelebrate
        .55s ease-in-out
        2;
    }

    @keyframes kittyCelebrate {
      0%, 100% {
        transform:
          translateY(0)
          rotate(0);
      }

      30% {
        transform:
          translateY(-14px)
          rotate(-8deg);
      }

      65% {
        transform:
          translateY(-9px)
          rotate(8deg);
      }
    }

    .paw-pop {
      position: fixed;

      pointer-events: none;

      z-index: 999;

      font-size: 22px;

      animation:
        pawExplosion
        1.1s ease-out forwards;
    }

    @keyframes pawExplosion {
      from {
        transform:
          translateY(0)
          scale(.3)
          rotate(0);

        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      to {
        transform:
          translateY(-120px)
          scale(1.3)
          rotate(35deg);

        opacity: 0;
      }
    }

    .sparkle {
      position: fixed;

      pointer-events: none;

      z-index: 999;

      font-size: 18px;

      animation:
        sparklePop
        .9s ease-out forwards;
    }

    @keyframes sparklePop {
      from {
        opacity: 0;

        transform:
          scale(.2)
          rotate(0deg);
      }

      30% {
        opacity: 1;
      }

      to {
        opacity: 0;

        transform:
          translateY(-60px)
          scale(1.5)
          rotate(90deg);
      }
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;

      padding:
        32px 10px 5px;

      font-size: 13px;

      opacity: .52;
    }

    .tiny-paw {
      display: inline-block;

      animation:
        tinyPaw
        2s ease-in-out infinite;
    }

    @keyframes tinyPaw {
      50% {
        transform:
          rotate(15deg)
          scale(1.15);
      }
    }

    /* =========================
       ACCESSIBILITY
    ========================= */

    @media
    (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration:
          .01ms !important;

        animation-iteration-count:
          1 !important;
      }
    }
  </style>
</head>

<body>

<main class="app">

  <!-- =====================
       HERO
  ====================== -->

  <header class="hero">

    <div class="hero-kitty">

      <div class="kitty kitty-black">

        <div class="kitty-tail"></div>

        <div class="kitty-body">
          <div class="kitty-belly"></div>
          <div class="kitty-paw paw-left"></div>
          <div class="kitty-paw paw-right"></div>
        </div>

        <div class="kitty-head">

          <div class="ear ear-left"></div>
          <div class="ear ear-right"></div>

          <div class="kitty-marking"></div>

          <div class="eye eye-left"></div>
          <div class="eye eye-right"></div>

          <div class="muzzle"></div>
          <div class="nose"></div>
          <div class="mouth"></div>

          <div class="whiskers whiskers-left"></div>
          <div class="whiskers whiskers-right"></div>

        </div>

      </div>

    </div>

    <h1>
      Kitty Coupons
    </h1>

    <p class="subtitle">
      Cupones mágicos aprobados por el
      Consejo Internacional de Gatitos.
      Reutilizables por toda la eternidad. ✨
    </p>

  </header>


  <!-- =====================
       STATUS
  ====================== -->

  <section class="status">

    <span class="status-label">
      Cupones disponibles
    </span>

    <span class="infinity">
      ∞ 🐾
    </span>

  </section>


  <!-- =====================
       COUPONS
  ====================== -->

  <section
    class="coupons"
    id="coupons"
  ></section>


  <footer>
    Made with ♡, snacks &
    <span class="tiny-paw">🐾</span>
    cat hair
  </footer>

</main>


<script>

  /*
  ==========================================
  COUPONS

  Para agregar un cupón nuevo solamente
  agrega otro objeto a esta lista.
  ==========================================
  */

  const coupons = [

    {
      name: "Vale por un café ☕",
      label: "☕ Programmer Fuel",
      description:
        "Válido hasta que se muera el programador. Porque, mientras haya código por escribir, siempre hay tiempo para un café.",
      kitty: "kitty-orange",
      color: "#ffdce7"
    },

    {
      name: "Vale por un Pumpkin Spice 🎃",
      label: "🎃 Seasonal Kitty",
      description:
        "Válido durante la temporada oficial del pumpkin. Ideal para esos días en los que el calendario dice otoño aunque el clima no esté cooperando.",
      kitty: "kitty-cream",
      color: "#ffe4bd"
    },

    {
      name: "Vale por un abrazo 🤍",
      label: "🤍 Hug Kitty",
      description:
        "Canjeable en cualquier momento y sin necesidad de justificación, porque los abrazos jamás están de más. Incluye modalidad de duración extendida.",
      kitty: "kitty-tuxedo",
      color: "#ddd4ff"
    },

    {
      name: "Vale por un ramen del matgo 🍜",
      label: "🍜 Ramen Kitty",
      description:
        "Canjeable por un buen ramen del matgo. Especialmente recomendado para días fríos, días largos o cualquier situación que pueda solucionarse con fideos.",
      kitty: "kitty-black",
      color: "#cef0df"
    },

    {
      name: "Vale por una hamburguesa 🍔",
      label: "🍔 Burger Kitty",
      description:
        "Canjeable cuando el cuerpo indique claramente que una ensalada no era la respuesta. Papitas altamente recomendadas, pero sujetas a negociación.",
      kitty: "kitty-orange",
      color: "#ffd8c7"
    },

    {
      name: "Vale por un desayuno 🍳",
      label: "🍳 Morning Kitty",
      description:
        "Porque empezar el día con algo rico mejora considerablemente cualquier pronóstico. Válido incluso si técnicamente ya es hora de comer.",
      kitty: "kitty-cream",
      color: "#fff0b8"
    },

    {
      name: "Vale por unos buenos chilaquiles 🌶️",
      label: "🌶️ Chilaquiles Kitty",
      description:
        "Canjeable por unos buenos chilaquiles dignos de comenzar el día. Verdes, rojos o cualquier combinación diplomáticamente aceptable.",
      kitty: "kitty-tuxedo",
      color: "#d7efcf"
    },

    {
      name: "Vale por una recomendación musical 🎧",
      label: "🎧 Music Kitty",
      description:
        "Canjeable por una canción cuidadosamente seleccionada para la ocasión, porque una buena canción siempre puede alegrar un poquito el día.",
      kitty: "kitty-black",
      color: "#ded8ff"
    },

    {
      name: "Vale por conocimiento académico 🎓",
      label: "🎓 Scholar Kitty",
      description:
        "Canjeable únicamente en temas conocidos por el doctorante. La precisión de la respuesta puede incrementarse proporcionalmente a la cantidad de café disponible.",
      kitty: "kitty-orange",
      color: "#cfe9f6"
    },

    {
      name: "Vale por un Red Bull ⚡",
      label: "⚡ Energy Kitty",
      description:
        "Para esas ocasiones en las que la energía natural ha abandonado oficialmente el chat. Canjeable por un pequeño boost para continuar la misión.",
      kitty: "kitty-black",
      color: "#d6e5ff"
    }

  ];


  /*
  ==========================================
  CREATE KITTY

  Genera el HTML de cada gatito.
  ==========================================
  */

  function createKitty(type) {

    return `
      <div class="kitty ${type}">

        <div class="kitty-tail"></div>

        <div class="kitty-body">

          <div class="kitty-belly"></div>

          <div
            class="kitty-paw paw-left"
          ></div>

          <div
            class="kitty-paw paw-right"
          ></div>

        </div>

        <div class="kitty-head">

          <div
            class="ear ear-left"
          ></div>

          <div
            class="ear ear-right"
          ></div>

          <div
            class="kitty-marking"
          ></div>

          <div
            class="eye eye-left"
          ></div>

          <div
            class="eye eye-right"
          ></div>

          <div class="muzzle"></div>

          <div class="nose"></div>

          <div class="mouth"></div>

          <div
            class="whiskers whiskers-left"
          ></div>

          <div
            class="whiskers whiskers-right"
          ></div>

        </div>

      </div>
    `;

  }


  /*
  ==========================================
  RENDER COUPONS

  Generamos automáticamente todos
  los cupones de la lista.
  ==========================================
  */

  function renderCoupons() {

    const container =
      document.getElementById(
        "coupons"
      );


    container.innerHTML =
      coupons.map((coupon, index) => `

        <article
          class="coupon"
          style="
            --coupon-color:
            ${coupon.color};
          "
        >

          <div class="coupon-header">

            <span class="coupon-label">
              ${coupon.label}
            </span>

            ${createKitty(
              coupon.kitty
            )}

          </div>


          <h2>
            ${coupon.name}
          </h2>


          <p>
            ${coupon.description}
          </p>


          <button
            class="redeem-button"
            data-coupon-index="${index}"
          >
            Canjear cupón 🐾
          </button>

        </article>

      `).join("");


    /*
    Agregamos los eventos después
    de crear los botones.
    */

    document
      .querySelectorAll(
        ".redeem-button"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const index =
              Number(
                button.dataset.couponIndex
              );

            const coupon =
              coupons[index];

            redeemCoupon(
              coupon.name,
              button
            );

          }
        );

      });

  }


  /*
  ==========================================
  DUMMY NOTIFICATION

  Actualmente sólo muestra un alert().

  Más adelante esta función será
  reemplazada por ntfy.
  ==========================================
  */

  function sendNotification(
    couponName
  ) {

    alert(
      `🐾 MIAU!\n\n` +
      `Se canjeó:\n` +
      `${couponName}\n\n` +
      `Este cupón puede volver a usarse ✨`
    );

  }


  /*
  ==========================================
  REDEEM COUPON

  No usamos localStorage.
  No hay límite de usos.
  Los cupones son infinitos.
  ==========================================
  */

  function redeemCoupon(
    name,
    button
  ) {

    const confirmed =
      confirm(
        `¿Quieres canjear "${name}"? 🐾`
      );


    if (!confirmed) {
      return;
    }


    const coupon =
      button.closest(
        ".coupon"
      );


    /*
    Evita tocar el botón varias veces
    mientras está celebrando.
    */

    if (
      button.dataset.busy === "true"
    ) {
      return;
    }


    button.dataset.busy =
      "true";


    /*
    Gatito celebra.
    */

    coupon.classList.add(
      "celebrate"
    );


    /*
    Patitas y estrellitas.
    */

    createCelebration();


    /*
    Cambiamos el botón
    temporalmente.
    */

    const originalText =
      button.textContent.trim();


    button.textContent =
      "¡Miau! Canjeado ✨";


    button.classList.add(
      "success"
    );


    /*
    Dummy notification.
    */

    setTimeout(() => {

      sendNotification(
        name
      );

    }, 250);


    /*
    Después vuelve a estar
    disponible normalmente.
    */

    setTimeout(() => {

      coupon.classList.remove(
        "celebrate"
      );

      button.classList.remove(
        "success"
      );

      button.textContent =
        originalText;

      button.dataset.busy =
        "false";

    }, 1600);

  }


  /*
  ==========================================
  PAWS + SPARKLES
  ==========================================
  */

  function createCelebration() {

    const symbols = [
      "🐾",
      "🐾",
      "🐾",
      "♡",
      "✦",
      "✨",
      "♡"
    ];


    for (
      let i = 0;
      i < 14;
      i++
    ) {

      const particle =
        document.createElement(
          "div"
        );


      const symbol =
        symbols[
          Math.floor(
            Math.random() *
            symbols.length
          )
        ];


      particle.textContent =
        symbol;


      particle.className =
        symbol === "🐾"
          ? "paw-pop"
          : "sparkle";


      particle.style.left =
        `${10 + Math.random() * 80}%`;


      particle.style.top =
        `${45 + Math.random() * 30}%`;


      particle.style.animationDelay =
        `${Math.random() * .25}s`;


      document.body.appendChild(
        particle
      );


      setTimeout(() => {

        particle.remove();

      }, 1400);

    }

  }


  /*
  ==========================================
  START
  ==========================================
  */

  renderCoupons();

</script>
